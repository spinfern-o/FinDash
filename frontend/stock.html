<body>
<a class="stock-skip" href="#workspace">Skip to workspace / 跳至工作区</a>
<div class="stock-layout">
  <aside class="stock-sidebar">
    <a class="wordmark" href="/">FinDash</a>
    <label class="stock-language" for="stock-language"><span data-text="language">Language</span>
      <select id="stock-language"><option value="en">English</option><option value="zh-CN">简体中文</option></select>
    </label>
    <nav aria-label="Workspace" id="stock-navigation">
      <a href="#files" data-view="files" data-text="files">Files</a>
      <a href="#review" data-view="review"><span data-text="review">To review</span> <span id="review-count">0</span></a>
      <a href="#items" data-view="items" data-text="items">Stock</a>
      <a href="/dashboard" data-text="dashboard">Profit and loss</a>
      <a href="#settings" data-view="settings" class="stock-settings-link" data-text="settings">Settings</a>
    </nav>
    <a href="/help" data-text="help">Help</a>
    <a href="/login" id="stock-account" data-text="login">Log in for invoice reading</a>
  </aside>
  <main id="workspace" tabindex="-1">
    <div class="stock-page-header">
      <div><p class="stock-eyebrow" data-text="eyebrow">YOUR DAILY RECORDS</p><h1 id="view-title">Add your records</h1></div>
      <button type="button" class="btn primary" id="add-item" data-text="addItem">Add an item</button>
    </div>
    <p id="stock-storage" class="stock-storage" role="status"></p>
    <p id="stock-message" class="stock-message" role="status" aria-live="polite" hidden></p>
    <div id="stock-panel"></div>
    <dialog id="stock-dialog" aria-labelledby="dialog-title"></dialog>
    <footer><a href="/about">About</a><a href="/developers">Developers</a><a href="mailto:support.findash@findash.tech?subject=FinDash" data-text="contact">Contact</a><a href="/privacy" data-text="privacy">Privacy</a><a href="/terms" data-text="terms">Terms</a><a href="/help" data-text="help">Help</a></footer>
