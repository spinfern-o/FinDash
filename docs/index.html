<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monthly Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&family=Newsreader:opsz,wght@6..72,300..500&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --ground:#f9fafb;
    --card:#ffffff;
    --line:#e7e5e4;
    --line-soft:#f1f0ee;
    --ink:#111827;
    --ink-2:#4b5563;
    --ink-3:#6b7280;
    --accent:#059669;

    /* categorical slots - validated light, surface #ffffff */
    --s1:#047857;   /* direct expenses    */
    --s2:#2a78d6;   /* operating expenses */
    --s3:#eb6834;   /* variable overhead  */
    --s4:#4a3aa7;   /* fixed overhead     */
    --rest:#e4e4e1; /* profit remainder   */

    --critical:#d03b3b;
    --radius:20px;
  }

  @media (prefers-color-scheme:dark){
    :root{
      color-scheme:dark;
      --ground:#141715;
      --card:#1c201e;
      --line:#2f3431;
      --line-soft:#262b28;
      --ink:#f2f4f2;
      --ink-2:#b7bdb9;
      --ink-3:#8b928e;
      --accent:#34d399;

      /* same hues, re-stepped for the dark surface #1c201e */
      --s1:#199e70;
      --s2:#3987e5;
      --s3:#d95926;
      --s4:#9085e9;
      --rest:#313733;

      --critical:#e26a6a;
    }
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}

  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:Inter,ui-sans-serif,system-ui,sans-serif;
    font-size:15px;
    line-height:1.55;
    padding-block:clamp(24px,5vw,56px);
    padding-left:clamp(16px,4vw,32px);
    padding-right:clamp(16px,4vw,32px);
  }

  main{max-width:1060px;margin:0 auto}

  /* ---- masthead ---- */
  .masthead{
    display:flex;flex-wrap:wrap;align-items:baseline;
    justify-content:space-between;gap:10px;margin-bottom:26px;
  }
  .wordmark{font-size:16px;font-weight:600;letter-spacing:-0.01em;margin:0}
  .stamp{font-size:13px;color:var(--ink-3)}

  /* ---- filter row: scopes every card below it ---- */
  .filters{
    display:flex;flex-wrap:wrap;gap:6px;
    margin:0 0 20px;padding:0;list-style:none;
  }
  .filters button{
    font:inherit;font-size:14px;font-weight:500;
    color:var(--ink-2);background:var(--card);
    border:1px solid var(--line);border-radius:999px;
    padding:7px 16px;cursor:pointer;text-transform:capitalize;
    transition:background .12s,color .12s,border-color .12s;
  }
  .filters button:hover{border-color:var(--ink-3);color:var(--ink)}
  .filters button[aria-current="true"]{
    background:var(--accent);border-color:var(--accent);color:#fff;
  }
  .filters button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  /* ---- csv loader ---- */
  .loader{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
    gap:10px 16px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:12px 14px 12px 18px;margin-bottom:16px;
    transition:border-color .12s,box-shadow .12s;
  }
  .loader.over{border-color:var(--accent);box-shadow:0 0 0 3px var(--line-soft)}
  .loader-text{min-width:0;font-size:13px;color:var(--ink-3)}
  .loader-text strong{display:block;font-size:14px;font-weight:600;color:var(--ink)}
  .loader-actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{
    font:inherit;font-size:13px;font-weight:500;
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:10px;padding:8px 14px;cursor:pointer;
    transition:border-color .12s,background .12s;
  }
  .btn:hover{border-color:var(--ink-3)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .loader-text .bad{color:var(--critical)}

  /* ---- cards ---- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:24px;
    min-width:0;
  }
  .card.wide{grid-column:1/-1}

  .card h2{
    font-family:Newsreader,"Iowan Old Style",Georgia,serif;
    font-size:21px;font-weight:400;letter-spacing:-0.005em;
    margin:0;
  }
  .card .sub{font-size:13px;color:var(--ink-3);margin:2px 0 20px}

  /* ---- hero ---- */
  .hero{padding:30px 28px 26px}
  .eyebrow{
    font-size:11px;font-weight:600;letter-spacing:.07em;
    text-transform:uppercase;color:var(--ink-3);margin:0 0 10px;
  }
  .figure{
    font-family:Newsreader,"Iowan Old Style",Georgia,serif;
    font-size:clamp(42px,7.5vw,64px);
    font-weight:400;line-height:1.04;letter-spacing:-0.02em;
    font-variant-numeric:normal;   /* proportional figures at display size */
    margin:0;color:var(--accent);
  }
  .figure.loss{color:var(--critical)}
  .note{font-size:14px;color:var(--ink-2);margin:12px 0 0;max-width:52ch}

  /* ---- stacked allocation bar ---- */
  .barwrap{position:relative}
  .bar{display:flex;gap:2px;height:38px}
  .bar .seg{
    border:none;padding:0;font:inherit;cursor:default;
    min-width:2px;border-radius:2px;transition:filter .12s;
  }
  .bar .seg:first-child{border-radius:8px 2px 2px 8px}
  .bar .seg:last-child{border-radius:2px 8px 8px 2px}
  .bar .seg:hover,.bar .seg:focus-visible{filter:brightness(1.12);outline:none}
  .bar .seg:focus-visible{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
  .seg-1{background:var(--s1)}
  .seg-2{background:var(--s2)}
  .seg-3{background:var(--s3)}
  .seg-4{background:var(--s4)}
  .seg-rest{background:var(--rest)}
  .seg-short{background:var(--critical)}

  /* revenue cut-off marker, shown only on a loss month */
  .revmark{position:absolute;top:-7px;bottom:-7px;width:2px;background:var(--ink)}
  .shortspan{
    position:absolute;bottom:-9px;height:3px;border-radius:2px;
    background:var(--critical);
  }
  .revmark span{
    position:absolute;top:-19px;left:0;transform:translateX(-50%);
    white-space:nowrap;font-size:11px;font-weight:600;color:var(--ink);
  }

  .tip{
    position:absolute;z-index:5;pointer-events:none;opacity:0;
    transform:translate(-50%,-100%);
    background:var(--ink);color:var(--ground);
    border-radius:8px;padding:7px 10px;font-size:12px;line-height:1.4;
    white-space:nowrap;transition:opacity .1s;
  }
  .tip.on{opacity:1}
  .tip b{font-weight:600}

  .key{
    display:flex;flex-wrap:wrap;gap:8px 20px;
    margin:16px 0 0;padding:0;list-style:none;font-size:13px;
  }
  .key li{display:flex;align-items:center;gap:7px;color:var(--ink-2)}
  .key i{width:10px;height:10px;border-radius:2px;flex:none}
  .key b{font-weight:500;color:var(--ink)}

  /* ---- budget gauge ---- */
  .gaugeline{
    display:flex;justify-content:space-between;align-items:baseline;
    gap:14px;font-size:14px;color:var(--ink-2);margin-bottom:12px;
  }
  .gaugeline strong{color:var(--ink);font-weight:600}
  .gaugeline strong.neg{color:var(--critical)}
  .gauge{position:relative;height:12px;background:var(--line-soft);border-radius:6px}
  .gauge-fill{height:100%;background:var(--accent);border-radius:6px}
  .gauge-fill.over{background:var(--critical)}
  .gauge-mark{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
  .gauge-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:8px}

  /* ---- monthly net bars ---- */
  .trend-scroll{--colw:78px;overflow-x:auto;overflow-y:hidden;padding-top:24px}
  .trend{
    display:flex;align-items:flex-end;gap:14px;height:150px;position:relative;
    min-width:max-content;
  }
  /* basis, not content, sets the column width - the bars carry no text and the
     labels do, so an auto basis would drift the two rows out of alignment.
     66px holds "September" at 12px; past that the row scrolls. */
  .trend .col{
    flex:1 0 var(--colw);min-width:0;
    display:flex;flex-direction:column;height:100%;position:relative;
  }
  /* transparent overlay: the whole column is the hit target, not just the bar */
  .trend .hit{
    position:absolute;inset:0;width:100%;
    background:none;border:none;padding:0;margin:0;
    cursor:pointer;border-radius:6px;
  }
  .trend .hit:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .trend .col:hover .mark{filter:brightness(.94)}
  .trend .above{flex:none;display:flex;align-items:flex-end}
  .trend .below{flex:none;display:flex;align-items:flex-start}
  .trend .mark{
    width:100%;background:var(--line);border:none;padding:0;cursor:default;
  }
  .trend .above .mark{border-radius:4px 4px 0 0}
  .trend .below .mark{border-radius:0 0 4px 4px}
  .trend .col.on .mark{background:var(--accent)}
  .trend .col.on.neg .mark{background:var(--critical)}
  .trend .zero{position:absolute;left:0;right:0;height:1px;background:var(--line)}
  .trend-labels{display:flex;gap:14px;margin-top:8px;min-width:max-content}
  .trend-labels div{
    flex:1 0 var(--colw);min-width:0;white-space:nowrap;
    text-align:center;font-size:12px;color:var(--ink-3);
    text-transform:capitalize;cursor:pointer;
  }
  .trend-labels div:hover{color:var(--ink)}
  .trend-labels div.on{color:var(--ink);font-weight:600}
  .trend .val{
    position:absolute;left:0;right:0;text-align:center;
    font-size:12px;font-weight:600;color:var(--ink);
  }

  /* ---- ledger table ---- */
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  caption{text-align:left;font-size:13px;color:var(--ink-3);padding-bottom:14px}
  th,td{padding:9px 0;border-bottom:1px solid var(--line-soft);font-weight:400;text-align:right}
  th{text-align:left}                      /* row labels in the Line column */
  /* Numeric columns are centred, header and values alike. Every cell in a
     column is the same width, so centring puts each value on the same centre
     line as its header. */
  thead th:not(:first-child),
  td.amt,
  td.share{text-align:center}
  thead th{
    font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
    color:var(--ink-3);border-bottom:1px solid var(--line);
  }
  .group th,.group td{font-weight:600}
  .indent{padding-left:22px;color:var(--ink-2);font-weight:400}
  .total th,.total td{font-weight:600;border-top:1px solid var(--line);border-bottom:none}
  .neg{color:var(--critical)}
  td.share{color:var(--ink-3);width:7.5em}
  td.amt{width:10em}

  .notice{
    margin-top:16px;padding:14px 16px;background:var(--card);
    border:1px solid var(--line);border-left:3px solid var(--critical);
    border-radius:10px;font-size:13px;color:var(--ink-2);
  }
  .notice code{font-size:12px}

  footer{margin-top:22px;font-size:12px;color:var(--ink-3)}

  @media (max-width:760px){
    .grid{grid-template-columns:1fr}
    .card{padding:20px}
    .hero{padding:24px 20px 22px}
    th,td{font-size:14px}
    .indent{padding-left:14px}
  }
</style>
</head>
<body>
<main>
  <div class="masthead">
    <p class="wordmark">Monthly Output</p>
    <span class="stamp" id="stamp"></span>
  </div>

  <div class="loader" id="loader">
    <div class="loader-text">
      <strong id="source">Published figures</strong>
      <span id="status">Read from data.json</span>
    </div>
    <div class="loader-actions">
      <input type="file" id="file" accept=".csv,text/csv" multiple hidden>
      <button type="button" class="btn primary" id="pick">Choose CSV files</button>
      <button type="button" class="btn" id="reset" hidden>Use published figures</button>
    </div>
  </div>

  <ul class="filters" id="months"></ul>
  <div id="sheet"></div>

  <footer id="footer"></footer>
</main>

<script>
// fallback for loading the real .json data after it loads

const FALLBACK = {
  generated: "sample data",
  months: [
    {month:"july",monthNum:7,revenue:72000,cogs:26000,labor:12000,utilities:2800,
     maintenance:950,hardware:0,directExpenses:45500,operatingExpenses:7750,
     variableOverhead:3750,fixedOverhead:7420,totalExpenses:64420,
     grossProfit:26500,netProfit:7580,budget:66000,budgetPercent:97.61},
    {month:"august",monthNum:8,revenue:64000,cogs:21000,labor:9000,utilities:3100,
     maintenance:4200,hardware:0,directExpenses:37500,operatingExpenses:6160,
     variableOverhead:7300,fixedOverhead:7620,totalExpenses:58580,
     grossProfit:26500,netProfit:5420,budget:57000,budgetPercent:102.77},
    {month:"september",monthNum:9,revenue:33000,cogs:11000,labor:3500,utilities:1900,
     maintenance:310,hardware:2400,directExpenses:20200,operatingExpenses:5560,
     variableOverhead:2210,fixedOverhead:8670,totalExpenses:36640,
     grossProfit:12800,netProfit:-3640,budget:34000,budgetPercent:107.76}
  ]
};

const money = n => (n < 0 ? "−" : "") + "$" +
  Math.abs(n).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
const money0 = n => (n < 0 ? "−" : "") + "$" +
  Math.round(Math.abs(n)).toLocaleString("en-US");
const pct = (part, whole) => whole ? (part / whole) * 100 : 0;
const fmtPct = n => (n < 0 ? "\u2212" : "") + Math.abs(n).toFixed(1) + "%";
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

let data, active;
const PUBLISHED_NOTE = "Figures come from data.json, written by the Java dashboard on each run.";
let sourceNote = PUBLISHED_NOTE;

/* ---------- the allocation bar ---------- */
/* Scaled to max(revenue, total costs) so a loss month cannot overflow the track.
   When costs outrun revenue, a marker shows where revenue ran out. */
function allocation(m) {
  const buckets = [
    [1, "Direct",            m.directExpenses],
    [2, "Operating",         m.operatingExpenses],
    [3, "Variable overhead", m.variableOverhead],
    [4, "Fixed overhead",    m.fixedOverhead]
  ];
  const net  = m.netProfit;
  const loss = net < 0;
  const span = Math.max(m.revenue, m.totalExpenses) || 1;

  const segs = buckets
    .filter(([, , v]) => v > 0)
    .map(([slot, name, v]) =>
      `<button type="button" class="seg seg-${slot}" style="flex:0 0 ${pct(v, span)}%"
         data-name="${name}" data-amt="${money(v)}" data-share="${fmtPct(pct(v, m.revenue))}"></button>`);

  if (!loss && net > 0) {
    segs.push(`<button type="button" class="seg seg-rest" style="flex:0 0 ${pct(net, span)}%"
      data-name="Profit" data-amt="${money(net)}" data-share="${fmtPct(pct(net, m.revenue))}"></button>`);
  }

  // On a loss month the costs run past the revenue line; the stretch beyond it
  // is the shortfall, marked under the track rather than stacked into it.
  const marker = loss
    ? `<div class="revmark" style="left:${pct(m.revenue, span)}%"><span>Revenue</span></div>
       <div class="shortspan" style="left:${pct(m.revenue, span)}%;right:0"></div>`
    : "";

  const key = buckets.map(([slot, name, v]) =>
    `<li><i class="seg-${slot}"></i><b>${name}</b> ${fmtPct(pct(v, m.revenue))}</li>`).join("");
  const tail = loss
    ? `<li><i class="seg-short"></i><b>Shortfall</b> ${fmtPct(pct(Math.abs(net), m.revenue))}</li>`
    : `<li><i class="seg-rest"></i><b>Profit</b> ${fmtPct(pct(net, m.revenue))}</li>`;

  return `
    <div class="barwrap">
      <div class="bar">${segs.join("")}</div>
      ${marker}
      <div class="tip" id="tip"></div>
    </div>
    <ul class="key">${key}${tail}</ul>`;
}

/* ---------- net profit across every month on file ---------- */
function trend(months, activeNum) {
  const nets = months.map(m => m.netProfit);
  const top  = Math.max(0, ...nets);
  const bot  = Math.min(0, ...nets);
  const span = (top - bot) || 1;
  const H    = 112; 
  const zero = (top / span) * H;

  const cols = months.map(m => {
    const n = m.netProfit, on = m.monthNum === activeNum, neg = n < 0;
    const h = (Math.abs(n) / span) * H;
    const label = on
      ? `<div class="val" style="${neg ? `top:${zero + h + 4}px` : `top:${zero - h - 20}px`}">${money0(n)}</div>`
      : "";
    return `<div class="col${on ? " on" : ""}${neg ? " neg" : ""}">
      <div class="above" style="height:${zero}px">
        ${neg ? "" : `<div class="mark" style="height:${h}px"></div>`}
      </div>
      <div class="below" style="height:${H - zero}px">
        ${neg ? `<div class="mark" style="height:${h}px"></div>` : ""}
      </div>
      ${label}
      <button type="button" class="hit" data-month="${m.monthNum}"
              aria-label="${m.month}, net ${money0(n)}"></button>
    </div>`;
  }).join("");

  const labels = months.map(m =>
    `<div class="${m.monthNum === activeNum ? "on" : ""}" data-month="${m.monthNum}"
     >${m.month}</div>`).join("");

  return `<div class="trend-scroll">
            <div class="trend">${cols}<div class="zero" style="top:${zero}px"></div></div>
            <div class="trend-labels">${labels}</div>
          </div>`;
}

function row(label, amount, revenue, cls = "") {
  return `<tr class="${cls}">
    <th scope="row">${label}</th>
    <td class="amt">${money(amount)}</td>
    <td class="share">${revenue ? fmtPct(pct(amount, revenue)) : "—"}</td>
  </tr>`;
}

function draw(m) {
  const rev  = m.revenue;
  const net  = m.netProfit;
  const loss = net < 0;
  const over = m.totalExpenses - m.budget;
  const used = m.budgetPercent;

  document.getElementById("sheet").innerHTML = `
    <div class="grid">
      <section class="card wide hero">
        <p class="eyebrow">${cap(m.month)} &middot; net result</p>
        <p class="figure${loss ? " loss" : ""}">${money(net)}</p>
        <p class="note">
          ${fmtPct(pct(net, rev))} of ${money(rev)} in revenue.
          ${loss
            ? `Costs ran past revenue by ${money(Math.abs(net))}.`
            : `Kept ${money(net)} after every cost.`}
        </p>
      </section>

      <section class="card wide">
        <h2>Where revenue goes</h2>
        <p class="sub">Every cost bucket as a share of ${money(rev)} in revenue</p>
        ${allocation(m)}
      </section>

      <section class="card">
        <h2>Against budget</h2>
        <p class="sub">Total costs measured against the month's budget</p>
        <div class="gaugeline">
          <span>Budget <strong>${money(m.budget)}</strong></span>
          <span><strong class="${used > 100 ? "neg" : ""}">${fmtPct(used)} used</strong></span>
        </div>
        <div class="gauge">
          <div class="gauge-fill${used > 100 ? " over" : ""}" style="width:${Math.min(used, 100)}%"></div>
          ${used > 100 ? '<div class="gauge-mark" style="left:100%"></div>' : ""}
        </div>
        <div class="gauge-foot">
          <span>${money(m.totalExpenses)} spent</span>
          <span>${over > 0 ? money(over) + " over" : money(-over) + " left"}</span>
        </div>
      </section>

      <section class="card">
        <h2>Net profit by month</h2>
        <p class="sub">Every month on file &middot; ${cap(m.month)} highlighted</p>
        ${trend(data.months, m.monthNum)}
      </section>

      <section class="card wide">
        <h2>Financial Report</h2>
        <p class="sub">Every line is the amount of dollars and the percent of the revenue</p>
        <table>
          <thead>
            <tr><th scope="col">Line</th><th scope="col">Amount</th><th scope="col">Of revenue</th></tr>
          </thead>
          <tbody>
            ${row("Revenue", rev, rev, "group")}

            ${row("Direct expenses", m.directExpenses, rev, "group")}
            ${row("Cost of goods sold", m.cogs, rev, "indent-row")}
            ${row("Labor", m.labor, rev, "indent-row")}

            ${row("Operating expenses", m.operatingExpenses, rev, "group")}
            ${row("Hardware", m.hardware, rev, "indent-row")}

            ${row("Variable overhead", m.variableOverhead, rev, "group")}
            ${row("Utilities", m.utilities, rev, "indent-row")}
            ${row("Maintenance", m.maintenance, rev, "indent-row")}

            ${row("Fixed overhead", m.fixedOverhead, rev, "group")}

            ${row("Total expenses", m.totalExpenses, rev, "total")}
            <tr class="total">
              <th scope="row">Net profit</th>
              <td class="amt ${loss ? "neg" : ""}">${money(net)}</td>
              <td class="share ${loss ? "neg" : ""}">${fmtPct(pct(net, rev))}</td>
            </tr>
          </tbody>
        </table>
      </section>
    </div>`;

  document.querySelectorAll(".indent-row th").forEach(th => th.classList.add("indent"));
  wireTooltip();
  centreActiveMonth();
}

/* With enough months the bar row scrolls; keep the selected one in view. */
function centreActiveMonth() {
  const box = document.querySelector(".trend-scroll");
  const col = document.querySelector(".trend .col.on");
  if (!box || !col) return;
  if (box.scrollWidth <= box.clientWidth) return;        // nothing to scroll
  box.scrollLeft = col.offsetLeft - (box.clientWidth - col.offsetWidth) / 2;
}

/* Hover/focus readout on the allocation bar. The same numbers live in the
   legend and the ledger below, so the tooltip only ever enhances. */
function wireTooltip() {
  const wrap = document.querySelector(".barwrap");
  const tip  = document.getElementById("tip");
  if (!wrap || !tip) return;

  const show = seg => {
    const box = seg.getBoundingClientRect();
    const ref = wrap.getBoundingClientRect();
    tip.innerHTML = `<b>${seg.dataset.name}</b> &middot; ${seg.dataset.amt}<br>${seg.dataset.share} of revenue`;
    tip.style.left = (box.left - ref.left + box.width / 2) + "px";
    tip.style.top  = "-8px";
    tip.classList.add("on");
  };
  const hide = () => tip.classList.remove("on");

  wrap.querySelectorAll(".seg").forEach(seg => {
    seg.addEventListener("mouseenter", () => show(seg));
    seg.addEventListener("focus", () => show(seg));
    seg.addEventListener("mouseleave", hide);
    seg.addEventListener("blur", hide);
  });
}

function build() {
  const list = document.getElementById("months");
  list.innerHTML = data.months.map(m =>
    `<li><button type="button" data-num="${m.monthNum}">${m.month}</button></li>`).join("");

  list.addEventListener("click", e => {
    const btn = e.target.closest("button");
    if (btn) select(Number(btn.dataset.num));
  });

  document.getElementById("stamp").textContent =
    data.generated ? "Generated " + data.generated : "";
  const foot = document.getElementById("footer");
  foot.textContent = sourceNote;
  foot.classList.remove("notice");

  select(data.months[0].monthNum);
}

function select(num) {
  active = data.months.find(m => m.monthNum === num);
  document.querySelectorAll(".filters button").forEach(b =>
    b.setAttribute("aria-current", Number(b.dataset.num) === num));
  draw(active);
}


/* ================= CSV loading =================
   The browser does the same arithmetic CFODashboard.java does, so a CSV
   dropped here never has to make a round trip through the Java app.
   CSV only for now - PDFs and statements are a separate job.
   Nothing is uploaded: files are read locally and never leave the page. */

/* Character-scanning parser: handles quoted fields, embedded commas,
   doubled "" escapes, and both \n and \r\n line endings. */
function parseCsv(text) {
  const rows = [];
  let row = [], field = "", quoted = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }   // "" -> literal quote
        else quoted = false;
      } else field += c;
    } else if (c === '"') {
      quoted = true;
    } else if (c === ",") {
      row.push(field); field = "";
    } else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); field = "";
      if (row.some(v => v.trim() !== "")) rows.push(row);
      row = [];
    } else field += c;
  }
  row.push(field);
  if (row.some(v => v.trim() !== "")) rows.push(row);

  return toTable(rows);
}

/* Grid of cells -> {headers, rows}. Shared by the CSV and xlsx readers so both
   get the same canonical header handling. */
function toTable(rows) {
  if (!rows.length) return {headers: [], rows: []};
  const headers = rows[0].map(canonical);
  return {
    headers,
    rows: rows.slice(1).map(r => {
      const o = {};
      headers.forEach((h, i) => o[h] = String(r[i] === undefined ? "" : r[i]).trim());
      return o;
    })
  };
}

/* ================= xlsx reading =================
   An .xlsx is a zip of XML. The browser can already unzip (DecompressionStream)
   and parse XML (DOMParser), so we read the two parts we need directly rather
   than pulling in a spreadsheet library. No dependency, no CDN, and the file
   still never leaves the machine. */

async function inflate(bytes, method) {
  if (method === 0) return bytes;                       // stored, not compressed
  const stream = new Blob([bytes]).stream()
    .pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

/* Walk the zip central directory -> {entryName: bytes} */
async function unzip(buf) {
  const dv = new DataView(buf), bytes = new Uint8Array(buf);

  let eocd = -1;                                        // end-of-central-directory
  for (let i = bytes.length - 22; i >= 0 && i > bytes.length - 65558; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("not a zip archive");

  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const files = {};

  for (let n = 0; n < count; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method   = dv.getUint16(p + 10, true);
    const compLen  = dv.getUint32(p + 20, true);
    const nameLen  = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const cmtLen   = dv.getUint16(p + 32, true);
    const localOff = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(bytes.subarray(p + 46, p + 46 + nameLen));

    // the local header repeats name/extra at its own lengths before the data
    const lnLen = dv.getUint16(localOff + 26, true);
    const leLen = dv.getUint16(localOff + 28, true);
    const start = localOff + 30 + lnLen + leLen;
    files[name] = await inflate(bytes.subarray(start, start + compLen), method);

    p += 46 + nameLen + extraLen + cmtLen;
  }
  return files;
}

/* "BC12" -> 54. xlsx omits empty cells, so the column comes from the ref. */
function colIndex(ref) {
  let n = 0;
  for (const ch of ref) {
    const c = ch.charCodeAt(0);
    if (c < 65 || c > 90) break;
    n = n * 26 + (c - 64);
  }
  return n - 1;
}

async function readXlsx(buf) {
  const files = await unzip(buf);
  const dec = new TextDecoder();
  const xml = name => new DOMParser().parseFromString(dec.decode(files[name]), "application/xml");

  let shared = [];
  if (files["xl/sharedStrings.xml"]) {                  // one <si> may hold several runs
    shared = [...xml("xl/sharedStrings.xml").getElementsByTagName("si")]
      .map(si => [...si.getElementsByTagName("t")].map(t => t.textContent).join(""));
  }

  const sheet = Object.keys(files)
    .filter(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n))
    .sort()[0];
  if (!sheet) throw new Error("no worksheet inside the workbook");

  const rows = [];
  for (const row of [...xml(sheet).getElementsByTagName("row")]) {
    const cells = [];
    for (const c of [...row.getElementsByTagName("c")]) {
      const i = colIndex(c.getAttribute("r") || "");
      const t = c.getAttribute("t");
      let v;
      if (t === "inlineStr") {
        v = [...c.getElementsByTagName("t")].map(x => x.textContent).join("");
      } else {
        const vEl = c.getElementsByTagName("v")[0];
        const raw = vEl ? vEl.textContent : "";
        v = t === "s" ? (shared[Number(raw)] || "") : raw;
      }
      while (cells.length < i) cells.push("");          // pad the gaps xlsx leaves out
      cells[i] = v;
    }
    if (cells.some(x => String(x).trim() !== "")) rows.push(cells);
  }
  return rows;
}

/* ---- header matching ----
   Headers arrive spelled however the author felt like spelling them. These
   three steps fold the common variations onto our canonical names, so the
   lookups below can stay simple. All of it runs locally - no network. */

/* Case, punctuation and spacing collapse: "Credit_Card-Fees " -> "credit card fees" */
const normalise = s =>
  String(s == null ? "" : s).toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();

const CANONICAL = [
  "month", "month num", "revenue", "budget",
  "cogs", "packaging", "rent", "utilities", "maintenance", "hardware",
  "insurance", "marketing", "credit card fees", "business license",
  "telephone", "employee meals", "tax", "labor"
];

/* Different words for the same line. Keys are already normalised. */
const SYNONYMS = {
  "cost of goods": "cogs", "cost of goods sold": "cogs", "food cost": "cogs",
  "salaries": "labor", "salaries wages": "labor", "wages": "labor",
  "payroll": "labor", "staff costs": "labor",
  "premises": "rent", "rent expense": "rent", "occupancy": "rent",
  "computer and hardware": "hardware", "computer hardware": "hardware",
  "equipment": "hardware",
  "telephone internet": "telephone", "phone": "telephone",
  "business license and permits": "business license",
  "licenses and permits": "business license", "permits": "business license",
  "insurance expenses": "insurance", "insurance expense": "insurance",
  "marketing expense": "marketing", "advertising": "marketing",
  "packaging supplies": "packaging",
  "maintenance and repairs": "maintenance", "repairs": "maintenance",
  "taxes": "tax", "payroll taxes": "tax",
  "income": "revenue", "sales": "revenue", "total revenue": "revenue",
  "month number": "month num", "month no": "month num", "period": "month num"
};

/* normalise -> exact synonym -> exact canonical -> longest whole-word prefix.
   The prefix step is what rescues labels carrying a parenthetical, e.g.
   "Utilities (gas, electricity, water)" -> "utilities". It requires a space
   after the match so "monthly revenue" can never collapse to "month". */
function canonical(header) {
  const n = normalise(header);
  if (SYNONYMS[n]) return SYNONYMS[n];
  if (CANONICAL.includes(n)) return n;

  let best = null;
  for (const key of Object.keys(SYNONYMS).concat(CANONICAL)) {
    if (n.startsWith(key + " ") && (!best || key.length > best.length)) best = key;
  }
  return best ? (SYNONYMS[best] || best) : n;
}

const NUM = v => {
  const n = Number(String(v).replace(/[$,\s]/g, ""));
  return Number.isFinite(n) ? n : 0;
};
const round2 = n => Math.round(n * 100) / 100;

/* The four buckets, column for column as CFODashboard.java defines them. */
const BUCKETS = {
  direct:    ["cogs", "labor", "employee meals", "tax"],
  operating: ["packaging", "credit card fees", "marketing", "hardware"],
  variable:  ["utilities", "maintenance"],
  fixed:     ["rent", "insurance", "business license", "telephone"]
};
const sumOf = (r, keys) => keys.reduce((t, k) => t + NUM(r[k]), 0);

/* Which of the two files is this? Decided by header, not by filename. */
const classify = h =>
  h.includes("revenue") ? "dashboard" :
  h.includes("cogs")    ? "expenses"  : null;

function monthsFromCsv(dash, exp) {
  const byNum = new Map(exp.rows.map(r => [NUM(r["month num"]), r]));
  const months = [], skipped = [];

  dash.rows.forEach(d => {
    const n = NUM(d["month num"]);
    const e = byNum.get(n);
    if (!e) { skipped.push(d.month || ("month " + n)); return; }

    const revenue = NUM(d.revenue), budget = NUM(d.budget);
    const directExpenses    = sumOf(e, BUCKETS.direct);
    const operatingExpenses = sumOf(e, BUCKETS.operating);
    const variableOverhead  = sumOf(e, BUCKETS.variable);
    const fixedOverhead     = sumOf(e, BUCKETS.fixed);
    const totalExpenses = directExpenses + operatingExpenses + variableOverhead + fixedOverhead;
    const grossProfit   = revenue - directExpenses;
    const netProfit     = grossProfit - operatingExpenses - variableOverhead - fixedOverhead;

    months.push({
      month: (d.month || ("month " + n)).toLowerCase(),
      monthNum: n, revenue,
      cogs: NUM(e.cogs), labor: NUM(e.labor), utilities: NUM(e.utilities),
      maintenance: NUM(e.maintenance), hardware: NUM(e.hardware),
      directExpenses, operatingExpenses, variableOverhead, fixedOverhead,
      totalExpenses, grossProfit, netProfit,
      budget, budgetPercent: budget ? round2(totalExpenses / budget * 100) : 0
    });
  });

  months.sort((a, b) => a.monthNum - b.monthNum);
  return {months, skipped};
}

/* ---- wiring ---- */
let published = null;                 // whatever data.json gave us, kept for Reset
const held = {dashboard: null, expenses: null};   // files picked so far

const els = {};
function say(main, detail, bad) {
  els.source.textContent = main;
  els.status.textContent = detail;
  els.status.className = bad ? "bad" : "";
}

async function handleFiles(list) {
  const files = [...list];
  if (!files.length) return;

  const readable = f => /\.(csv|xlsx)$/i.test(f.name);
  const rejected = files.filter(f => !readable(f));
  const usable   = files.filter(readable);

  if (!usable.length) {
    const xls = rejected.some(f => /\.xls$/i.test(f.name));
    return say("Not read", rejected.map(f => f.name).join(", ") +
      (xls ? " — .xls is the older Excel format; re-save it as .xlsx or CSV."
           : " — CSV and .xlsx are the formats read right now."), true);
  }

  const unknown = [], unreadable = [];
  for (const f of usable) {
    let parsed;
    try {
      parsed = /\.xlsx$/i.test(f.name)
        ? toTable(await readXlsx(await f.arrayBuffer()))
        : parseCsv(await f.text());
    }
    // a file we could not open at all is a different problem from one whose
    // columns we did not recognise - don't give column advice for a broken file
    catch (err) { unreadable.push(f.name + " (" + err.message + ")"); continue; }

    const kind = classify(parsed.headers);
    if (kind) held[kind] = Object.assign(parsed, {fileName: f.name});
    else unknown.push(f.name);
  }

  if (unreadable.length) {
    return say("Could not open", unreadable.join(", "), true);
  }
  if (unknown.length) {
    return say("Unrecognized columns", unknown.join(", ") +
      " — need a revenue column (dashboard) or a cogs column (expenses).", true);
  }
  if (!held.dashboard) return say("Need one more file", "Got the expenses CSV. Still need the one with month, revenue and budget.", true);
  if (!held.expenses)  return say("Need one more file", "Got the dashboard CSV. Still need the one with the expense columns.", true);

  const {months, skipped} = monthsFromCsv(held.dashboard, held.expenses);
  if (!months.length) {
    return say("Nothing to show", "No month number in the dashboard CSV matched a row in the expenses CSV.", true);
  }

  const note = skipped.length ? " · skipped " + skipped.join(", ") + " (no expenses row)" : "";
  sourceNote = "Calculated in your browser from " + held.dashboard.fileName +
               " and " + held.expenses.fileName + ". Nothing was uploaded.";
  render({generated: null, months});
  say("Your figures", months.length + " month" + (months.length > 1 ? "s" : "") +
      " from " + held.dashboard.fileName + " + " + held.expenses.fileName + note, false);
  els.reset.hidden = !published;
}

function wireLoader() {
  els.source = document.getElementById("source");
  els.status = document.getElementById("status");
  els.reset  = document.getElementById("reset");
  const loader = document.getElementById("loader");
  const input  = document.getElementById("file");

  // #sheet is never replaced, only refilled, so one listener covers every redraw
  document.getElementById("sheet").addEventListener("click", e => {
    const hit = e.target.closest("[data-month]");
    if (hit) select(Number(hit.dataset.month));
  });

  document.getElementById("pick").addEventListener("click", () => input.click());
  input.addEventListener("change", e => { handleFiles(e.target.files); input.value = ""; });

  els.reset.addEventListener("click", () => {
    held.dashboard = held.expenses = null;
    sourceNote = PUBLISHED_NOTE;
    render(published);
    say("Published figures", "Read from data.json", false);
    els.reset.hidden = true;
  });

  // Drop anywhere on the page. preventDefault on dragover is what stops the
  // browser from just navigating to the dropped file.
  let depth = 0;
  document.addEventListener("dragenter", e => { e.preventDefault(); depth++; loader.classList.add("over"); });
  document.addEventListener("dragover",  e => e.preventDefault());
  document.addEventListener("dragleave", e => { e.preventDefault(); if (--depth <= 0) loader.classList.remove("over"); });
  document.addEventListener("drop", e => {
    e.preventDefault(); depth = 0; loader.classList.remove("over");
    handleFiles(e.dataTransfer.files);
  });
}

/* Single entry point for the data. Anything that can produce the same shape
   as data.json can call render() - that is where a future upload would hand
   its parsed result in. */
function render(json) {
  data = json;
  build();
}

wireLoader();

fetch("data.json")
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(json => { published = json; render(json); })
  .catch(() => {
    sourceNote = "";
    render(FALLBACK);
    const f = document.getElementById("footer");
    f.innerHTML = 'Showing sample figures. <code>data.json</code> could not be loaded — ' +
      'serve this folder over http (<code>python3 -m http.server</code>) ' +
      'or place data.json alongside this file.';
    f.classList.add("notice");
    say("Sample figures", "data.json could not be read \u2014 load your CSVs above", true);
  });
</script>
</body>
