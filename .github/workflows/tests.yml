# Runs every test on each pull request and on every push to main, so a
# change that breaks the figures, saving or logging in is caught before it
# reaches customers. The tests use stand-ins for Supabase and Claude: no
# secrets are needed and nothing is spent.

name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  website:
    name: Website and server functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Run the tests
        run: npm test

      - name: Check the forecast service compiles
        run: python3 -m py_compile forecast/main.py

  java:
    name: Java app builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compile
        run: mvn -B -q compile
